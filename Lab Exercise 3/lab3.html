<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lab 3 - Interactive Contact Form & Calculator</title>
    </head>
    <body>
        <div>
            <h1>Contact & Sum Calculator Webpage</h1>
            <span>An Interactive Form for Inquiries and Calculations</span>
        </div>
        <hr>
        <div>
            <div>
                <h2>Contact Us</h2>
                <form action="#" method="post">
                    <p>
                        <label for="user-email">Email Address:</label><br>
                        <input type="email" id="user-email" name="user-email" placeholder="Interactive@email.com" required>

                    </p>
                    <p>
                        <label for="contact-date">Preferred Contact Date:</label><br>
                        <input type="date" id="contact-date" name="contact-date" required>
                        
                    </p>
                    <p>
                        <label for="satisfaction">Satisfaction Level (0 to 10):</label><br>
                        <input type="range" id="satisfaction" name="satisfaction" min="0" max="10" value="5">
                    </p>
                    <p>
                        <input type="submit" value="Submit">
                    </p>
                </form>
            </div>
        </div>
        <hr>
        <div>
            <h2>Inline Calculator</h2>
            <form oninput="result.value = (parseFloat(num1.value) || 0) + (parseFloat(num2.value) || 0)">
                <label for="num1">Number 1:</label>
                <input type="number" id="num1" name="num1" value="0">

                +
                
                <label for="num2">Number 2:</label>
                <input type="number" id="num2" name="num2" value="0">

                =

                <strong>Total Sum: </strong>
                <output name="result" for="num1 num2">0</output>
            </form>
        </div>
        <hr>
        <div>
            <p>Contact: Interactive@gmail.com | Tel: 04-668 889</p>
            <p>Copyright &copy; 2024 Lab 3 Project, Inc. All rights reserved.</p>
        </div>

    </body>
</html>
